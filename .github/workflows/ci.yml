# CI for carto (spec Section 6 "Security CI", Section 14.8, Section 20).
# Every job runs on pull requests and on pushes to main. Scanners fail the build on high and
# critical findings; exceptions with an expiry go in docs/security-exceptions.md.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every step runs as bash -eo pipefail. Without it, `make leak | tee leak.log` reports tee's
# status, so a failing leak test passed (docs/plans/M1-review-fixes.md, package B).
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  python:
    name: lint, types, tests, schema, simulator, eval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install workspace
        run: uv sync --locked --all-packages
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Format check
        run: uv run ruff format --check .
      - name: Types (mypy --strict)
        run: uv run mypy
      # Both scenarios before the tests: the simulator-gated tests (`needs_sim`) skip silently
      # when sim-out/shop is missing (ADR 0072).
      - name: Simulator scenario A (14 days) and scenario C (28 days)
        run: |
          make sim SCENARIO=shop DAYS=14 SEED=1
          make sim SCENARIO=people_ops DAYS=28 SEED=1
      - name: Tests (unit and property; integration tests run in their own job)
        run: >
          uv run pytest -m "not integration" --cov --cov-report=xml --cov-report=term
          --junitxml=pytest-report.xml
      - name: Annotate test failures
        if: failure()
        run: uv run python tools/ci/annotate.py junit pytest-report.xml
      - name: JSON Schema drift check
        run: uv run carto-schema check --dir packages/carto-schema/schemas
      - name: Eval harness (scoring self-check, M0 path)
        run: make eval SCENARIO=shop DAYS=14 SEED=1
      - name: Eval with the engine, in memory (spec 18.4; analyzer, load, discover, map, score)
        run: |
          make eval-engine SCENARIO=shop DAYS=14 SEED=1 ENGINE=memory EVAL_OUT=eval/reports/engine
          make eval-engine SCENARIO=people_ops DAYS=28 SEED=1 ENGINE=memory EVAL_OUT=eval/reports/engine
      - name: Simulator output summary
        run: |
          echo "## Simulator output" >> "$GITHUB_STEP_SUMMARY"
          du -sh sim-out/shop sim-out/people_ops >> "$GITHUB_STEP_SUMMARY"
          find sim-out/shop -type f | wc -l | xargs -I{} echo "{} files (shop)" >> "$GITHUB_STEP_SUMMARY"
          echo "## Eval report (engine, shop 14 days)" >> "$GITHUB_STEP_SUMMARY"
          cat eval/reports/engine/shop.md >> "$GITHUB_STEP_SUMMARY"
          echo "## Eval report (engine, people_ops 28 days)" >> "$GITHUB_STEP_SUMMARY"
          cat eval/reports/engine/people_ops.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-report
          path: eval/reports/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  web:
    name: web (lint, types, unit, build, e2e with axe and the XSS corpus)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the locked dependencies
        run: npm ci
      - name: Lint (ESLint with the spec 13 sink rules)
        run: npm run lint
      - name: Types (tsc, including the OpenAPI contract check)
        run: npm run typecheck
      - name: Format check
        run: npm run format:check
      - name: Unit tests (Vitest)
        run: npm run test
      - name: Production build and build check (no mock API, strict CSP)
        run: npm run build
      - name: Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests with axe and the XSS corpus (threat 4)
        run: npm run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore

  integration:
    name: integration (testcontainers, leak test, analyzer, bundle round trip)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install workspace
        run: uv sync --locked --all-packages
      - name: Simulator scenario A (14 days) and scenario C (28 days)
        run: |
          make sim SCENARIO=shop DAYS=14 SEED=1
          make sim SCENARIO=people_ops DAYS=28 SEED=1
      - name: Docker-backed integration tests (PostgreSQL, MySQL, ClickHouse)
        run: uv run pytest -m integration -q --junitxml=integration-report.xml
      - name: Annotate integration test failures
        if: failure()
        run: uv run python tools/ci/annotate.py junit integration-report.xml
      - name: Offline analyzer over scenario A
        run: make analyze SCENARIO=shop 2>&1 | tee analyze-shop.log
      - name: Leak test over scenario A (spec 18.3)
        run: make leak SCENARIO=shop 2>&1 | tee leak-shop.log
      - name: Offline analyzer over scenario C
        run: make analyze SCENARIO=people_ops 2>&1 | tee analyze-people_ops.log
      - name: Leak test over scenario C (spec 18.3)
        run: make leak SCENARIO=people_ops 2>&1 | tee leak-people_ops.log
      - name: Annotate analyzer and leak test failures
        if: failure()
        run: |
          for scenario in shop people_ops; do
            [ -f "analyze-$scenario.log" ] && python3 tools/ci/annotate.py tail "analyze-$scenario.log" --title "make analyze SCENARIO=$scenario" --lines 40
            [ -f "leak-$scenario.log" ] && python3 tools/ci/annotate.py tail "leak-$scenario.log" --title "make leak SCENARIO=$scenario" --lines 80
          done
          true
      - name: Throughput benchmark (spec 17, informative on shared runners)
        run: make bench SCENARIO=shop | tee bench.txt
      - name: Gateway path benchmark (ADR 0028, informative on shared runners)
        run: make bench-gateway SCENARIO=shop | tee bench-gateway.txt
      - name: Benchmark summary
        run: |
          echo "## Edge benchmark" >> "$GITHUB_STEP_SUMMARY"
          cat bench.txt bench-gateway.txt >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=bench pipeline::$(grep -E '^  events ' bench.txt | tr -s ' ')"
          echo "::notice title=bench gateway::$(grep -E '^  forwarded ' bench-gateway.txt | tr -s ' ')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-manifest
          path: |
            sim-out/shop.carto/manifest.json
            sim-out/shop.carto/MANIFEST.md
          if-no-files-found: error

  images:
    name: service images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build carto-edge
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/base.Dockerfile
          build-args: |
            MEMBER=edge
            ENTRY=carto-edge
          push: false
          load: true
          tags: carto-edge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build carto-core
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/base.Dockerfile
          build-args: |
            MEMBER=core
            ENTRY=carto-core
          push: false
          load: true
          tags: carto-core:ci
          cache-from: type=gha
      - name: Smoke test the images (run as non-root, print version)
        run: |
          # Capture first: under pipefail, head closing the pipe early fails the step.
          edge_help="$(docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges carto-edge:ci --help)"
          core_help="$(docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges carto-core:ci --help)"
          sed -n 1,5p <<< "$edge_help"
          sed -n 1,5p <<< "$core_help"
      - name: Trivy image scan (carto-edge)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: carto-edge:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy image scan (carto-core)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: carto-core:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  compose:
    name: compose stack (simulator live replay, ingest to ClickHouse, console, push routes, live leak scan)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Both push-route proxies (ADR 0032) run in every command of this job. dev.env carries the
      # Dex values of the dev profile; compose.yaml itself defaults to production values (ADR
      # 0072). The job reaches the published ports from the runner, so the loopback binding holds.
      COMPOSE: >-
        docker compose -f deploy/compose/compose.yaml --env-file deploy/compose/dev.env
        --profile push-otlp --profile push-webhooks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the service images
        run: make images
      # carto-edge and carto-core are scanned in the images job; these three are built only here.
      - name: Trivy image scan (carto-ctl)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: carto-ctl:dev
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy image scan (carto-simulator)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: carto-simulator:dev
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy image scan (carto-web)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: carto-web:dev
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate the database passwords and the dev secrets
        run: |
          for s in pg_password ch_password ch_reader_password pg_ingest_password pg_app_password pg_worker_password oidc_client_secret; do
            openssl rand -hex 24 | tr -d '\r\n' > "deploy/compose/secrets/$s"
          done
      - name: Generate a throwaway certificate for the webhook proxy and the console
        run: |
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 2 \
            -subj /CN=localhost -addext subjectAltName=DNS:localhost \
            -keyout deploy/compose/proxy-tls/tls.key -out deploy/compose/proxy-tls/tls.crt
          # The proxies run as uid 10001; a pilot chowns the key to it instead.
          chmod 644 deploy/compose/proxy-tls/tls.key
      - name: Start the stack (one-shot jobs, databases, ingest-api, api, worker, web, dex, edge-gateway, collector)
        run: |
          $COMPOSE --profile dev up -d --scale simulator=0
          wait_healthy() {
            for i in $(seq 1 60); do
              id=$($COMPOSE ps -q "$1")
              health=$(docker inspect -f '{{.State.Health.Status}}' "$id" 2>/dev/null || echo starting)
              echo "$1: $health"
              [ "$health" = healthy ] && return 0
              sleep 5
            done
            return 1
          }
          wait_healthy ingest-api
          wait_healthy api
          wait_healthy web
          $COMPOSE ps -a
          for job in volumes-init pki-init key-init migrate; do
            code=$(docker inspect -f '{{.State.ExitCode}}' "$($COMPOSE ps -aq $job)")
            echo "$job exited $code"
            [ "$code" = 0 ]
          done
      - name: The one-shot jobs are idempotent (a second up changes nothing)
        run: |
          $COMPOSE up -d
          for job in pki-init key-init migrate; do
            [ "$(docker inspect -f '{{.State.ExitCode}}' "$($COMPOSE ps -aq $job)")" = 0 ]
          done
      - name: The console answers through the web proxy (ADR 0052)
        run: |
          curl -fsSk https://localhost:8080/healthz
          # Unauthenticated API calls are refused, never served; metrics are never proxied.
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8080/api/v1/me)
          echo "GET /api/v1/me without a session: $code"; [ "$code" = 401 ]
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8080/metrics)
          echo "GET /metrics through the proxy: $code"; [ "$code" = 404 ]
          curl -sk -D - -o /dev/null https://localhost:8080/ | tr -d '\r' | grep -i '^content-security-policy:' | grep -q "default-src 'self'"
          # Login redirects to the dev identity provider under the console origin.
          location=$(curl -sk -o /dev/null -w '%{redirect_url}' https://localhost:8080/api/v1/auth/login)
          echo "login redirects to: $location"; echo "$location" | grep -q '^https://localhost:8080/dex/'
          # The worker leases its recurring jobs and the audit chain verifies.
          $COMPOSE run --rm --no-deps -T worker worker --once
          $COMPOSE run --rm --no-deps -T api audit-verify
          echo "console: proxy, auth redirect, worker once, audit chain ok" >> "$GITHUB_STEP_SUMMARY"
      - name: Replay one simulated day at high speed into the stack
        run: >
          $COMPOSE --profile dev run --rm -T simulator live --scenario shop --days 1
          --daily-volume 40 --seed 3 --speed 100000 --out /data/sim
      - name: Wait for events in ClickHouse
        run: |
          query() {
            $COMPOSE exec -T clickhouse clickhouse-client --user carto \
              --password "$(cat deploy/compose/secrets/ch_password)" -q "$1"
          }
          for i in $(seq 1 72); do
            events=$(query "SELECT count() FROM carto.events" || echo 0)
            sources=$(query "SELECT uniqExact(source_id) FROM carto.events" || echo 0)
            echo "events: $events from $sources sources"
            [ "${sources:-0}" -ge 6 ] && break
            sleep 5
          done
          [ "${events:-0}" -gt 0 ]
          query "SELECT source_id, count() FROM carto.events GROUP BY source_id ORDER BY source_id"
          echo "## Compose stack" >> "$GITHUB_STEP_SUMMARY"
          echo "events in ClickHouse: $events from $sources sources" >> "$GITHUB_STEP_SUMMARY"
      - name: Push routes through the proxies (ADR 0031, 0032)
        run: |
          query() {
            $COMPOSE exec -T clickhouse clickhouse-client --user carto \
              --password "$(cat deploy/compose/secrets/ch_password)" -q "$1"
          }
          count() { query "SELECT count() FROM carto.events WHERE source_id = '$1'"; }
          webstore_before=$(count src_webstore_log)
          # Webhooks: the HMAC secret into the edge's local secret store, then a signed request
          # through proxy-webhooks, and the refusals.
          openssl rand -hex 24 > webhook-secret
          $COMPOSE run --rm --no-deps -T edge-gateway secret set shop_webhook_secret < webhook-secret
          python3 tools/ci/push_routes.py webhook --port 8443 \
            --ca deploy/compose/proxy-tls/tls.crt --secret-file webhook-secret \
            --source src_shop_hooks
          # OTLP: a collector certificate for a host outside the stack, signed by the
          # edge-gateway CA, through the proxy-otlp passthrough.
          mkdir -m 777 collector-pki
          $COMPOSE run --rm --no-deps -T -v "$PWD/collector-pki:/out" pki-init \
            pki issue --listener edge-gateway --name ci-collector \
            --ca-key-dir /etc/carto/pki-ca --out /out
          sudo chown -R "$(id -u)" collector-pki
          python3 tools/ci/push_routes.py otlp --port 4318 --pki collector-pki \
            --source src_webstore_log
          for i in $(seq 1 24); do
            hooks=$(count src_shop_hooks)
            webstore=$(count src_webstore_log)
            echo "webhook events: $hooks, webstore events: $webstore_before -> $webstore"
            [ "${hooks:-0}" -ge 1 ] && [ "${webstore:-0}" -gt "$webstore_before" ] && break
            sleep 5
          done
          [ "${hooks:-0}" -ge 1 ] && [ "${webstore:-0}" -gt "$webstore_before" ]
          echo "push routes: webhook and OTLP events reached ClickHouse" >> "$GITHUB_STEP_SUMMARY"
      - name: Export rows, markers and logs
        run: |
          mkdir -p scan
          for table in events event_identifiers; do
            $COMPOSE exec -T clickhouse clickhouse-client --user carto \
              --password "$(cat deploy/compose/secrets/ch_password)" \
              -q "SELECT * FROM carto.$table FORMAT JSONEachRow" > "scan/$table.ndjson"
          done
          $COMPOSE --profile dev run --rm -T --entrypoint cat simulator \
            /data/sim/ground_truth/markers.json > scan/markers.json
          $COMPOSE --profile dev logs --no-color --no-log-prefix ingest-api edge-gateway migrate \
            api worker web dex proxy-webhooks proxy-otlp > scan/logs.txt
          wc -c scan/*
      - name: Leak scan of everything core stored and every product log (spec 18.3)
        run: >
          python3 tools/ci/leak_scan.py --markers scan/markers.json
          --rows scan/events.ndjson --rows scan/event_identifiers.ndjson --text scan/logs.txt
      - name: Stack logs on failure
        if: failure()
        run: |
          $COMPOSE --profile dev ps -a > compose-ps.txt 2>&1 || true
          $COMPOSE --profile dev logs --no-color --tail 60 > compose.log 2>&1 || true
          cat compose-ps.txt
          tail -n 400 compose.log
          python3 tools/ci/annotate.py tail compose-ps.txt --title "compose ps -a" --lines 40
          python3 tools/ci/annotate.py tail compose.log --title "compose logs (tail)" --lines 150
          for svc in volumes-init pki-init key-init migrate ingest-api api worker web dex \
            edge-gateway otel-collector proxy-webhooks proxy-otlp clickhouse postgres; do
            $COMPOSE logs --no-color --no-log-prefix --tail 40 "$svc" > "svc-$svc.log" 2>&1 || true
            python3 tools/ci/annotate.py tail "svc-$svc.log" --title "logs: $svc" --lines 40
          done
      - name: Tear down
        if: always()
        run: $COMPOSE --profile dev down -v --remove-orphans

  bandit:
    name: bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --all-packages
      - run: uv run bandit -c pyproject.toml -r packages edge core simulator eval tools -q

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --all-packages
      - name: Export locked requirements (all members, dev included)
        # en-core-web-sm is the spaCy model pinned by URL and hash (ADR 0020): not on PyPI, so
        # pip-audit cannot look it up (docs/security-exceptions.md).
        run: >
          uv export --all-packages --no-emit-workspace --no-emit-package en-core-web-sm
          --no-hashes --format requirements-txt -o requirements-export.txt
      - name: pip-audit
        run: uv run pip-audit -r requirements-export.txt --strict --desc on 2>&1 | tee pip-audit.log
      - name: Annotate pip-audit findings
        if: failure()
        run: python3 tools/ci/annotate.py tail pip-audit.log --title "pip-audit" --lines 60

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rule self-tests (spec 18.3)
        run: semgrep --test --metrics=off tools/semgrep
      - name: Read-only connector rule over connector modules (spec 8.1, ADR 0008)
        run: semgrep scan --config tools/semgrep --error --metrics=off edge/carto_edge/connectors
      - name: Registry rulesets over the repository
        run: >
          semgrep scan --config p/python --config p/secrets --error --metrics=off
          --exclude legacy --exclude tools/semgrep --text-output=semgrep.txt .
      - name: Annotate semgrep findings
        if: failure()
        run: python3 tools/ci/annotate.py tail semgrep.txt --title "semgrep" --lines 120

  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Scan the lockfile
        run: |
          docker run --rm -v "$PWD:/src" \
            ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0 \
            scan source --lockfile /src/uv.lock

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Annotate gitleaks findings (rule, file and line; values redacted)
        if: failure()
        run: |
          curl -sSfL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git . --redact --no-banner --config .gitleaks.toml \
            --report-format json --report-path gitleaks.json || true
          python3 tools/ci/annotate.py gitleaks gitleaks.json

  trivy:
    name: trivy (filesystem)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: legacy
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
