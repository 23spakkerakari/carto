[project]
name = "carto-core"
version = "0.1.0"
description = "carto core: ingest, profiler, linker, assembler, detector, notifier, api, llm-gateway (spec Sections 9 to 12). ingest-api, migrations and the bundle loader land in M1; profiler, linker, api, worker and llm-gateway in M2."
requires-python = ">=3.12"
dependencies = [
  "carto-schema",
  "carto-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "clickhouse-connect>=0.8",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "zstandard>=0.23",
  "cryptography>=43",
  "httpx>=0.28",
  "datasketch>=1.6",
  "numpy>=2.0",
  "authlib>=1.3",
  "joserfc>=1.0",
]

[project.scripts]
carto-core = "carto_core.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carto_core"]

# The migration scripts live at core/migrations (spec Section 20) and ship inside the wheel, so
# a non-editable install (the service images) can run `carto-core migrate`.
[tool.hatch.build.targets.wheel.force-include]
"migrations/clickhouse" = "carto_core/_migrations/clickhouse"
"migrations/postgres" = "carto_core/_migrations/postgres"
