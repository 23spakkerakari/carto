# The spec 14.7 response headers of the console (ADR 0052), as one snippet. nginx's add_header
# is inherited from the server level only by a location that declares no add_header of its own:
# a location that adds any header (Cache-Control, say) silently drops every server-level header.
# So every location in nginx.conf that adds a header includes this file, the server block
# includes it for the locations that add none, and scripts/check-nginx.mjs (run by
# `npm run build`) fails the build when a location with add_header lacks the include.
# `always` keeps the headers on error responses too. `$csp` is the map in nginx.conf: the
# policy of web/src/csp.ts, verbatim, which scripts/check-build.mjs asserts.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy $csp always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header X-Frame-Options DENY always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
